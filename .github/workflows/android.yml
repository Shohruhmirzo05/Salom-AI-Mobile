name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # Debug only. Release signing needs the upload keystore, which stays on the
      # maintainer's machine and out of CI — a once-a-year release does not justify
      # putting a signing key in a secrets store.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: salom-ai-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-app/app/build/reports/lint-results-debug.html
          retention-days: 7
